name: workout_flutter_guide
description: >-
  302 exercises with 906 offline SVG frames, a typed catalog with search and
  filters, and ready-to-use Flutter widgets. Community port of
  @bryllim/workout-guide.
version: 0.1.0
repository: https://github.com/Jonathanlight/workout-flutter-guide
issue_tracker: https://github.com/Jonathanlight/workout-flutter-guide/issues

topics:
  - fitness
  - exercise
  - workout
  - svg
  - illustrations

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path: ^1.9.0
  xml: ^7.0.0

